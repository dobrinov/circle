[workspace]
members = [".", "mcp", "xtask"]
resolver = "2"

[package]
name = "circle"
version = "0.1.3"
edition = "2024"
description = "A calm, sidebar-first web browser built on Chromium (CEF)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dobrinov/circle"
publish = false

[lib]
name = "circle"
# The cdylib is only used on Windows, where the sandboxed `bootstrap.exe`
# from CEF loads `circle.dll` and calls `RunWinMain`.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "circle"
path = "src/main.rs"

# macOS requires a separate helper executable for the GPU, renderer and
# utility sub-processes. On Linux and Windows the main executable is reused.
[[bin]]
name = "circle-helper"
path = "src/bin/circle-helper.rs"

[features]
default = ["sandbox"]
sandbox = ["cef/sandbox"]

[dependencies]
cef = { version = "=154.5.0", default-features = false }
cef-dll-sys = "=154.5.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
url = "2"
arboard = { version = "3", default-features = false }
getrandom = "0.3"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
gif = { version = "0.13", default-features = false, features = ["color_quant", "std"] }
jpeg-decoder = { version = "0.3", default-features = false }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSCursor",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "objc2-quartz-core",
] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-quartz-core = "0.3.2"

# Image and GIF encoding crunch numbers; keep them fast in debug builds too.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"
