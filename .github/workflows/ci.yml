# Every push to main and every pull request: lint, then build, test and
# package on all platforms. Packages are kept for two weeks as artifacts.
name: CI

on:
  push:
    branches: [main]
    # The website and docs don't change what gets built.
    paths-ignore: ["docs/**", "**.md"]
  pull_request:
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format and Clippy
    runs-on: macos-latest
    env:
      CEF_PATH: ${{ github.workspace }}/../cef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Cache CEF binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../cef
          key: cef-aarch64-apple-darwin-${{ hashFiles('Cargo.lock') }}
      - run: brew install ninja || true
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Linux and Windows code type-checks here in a minute, without
      # building Chromium for them (`cef/dox` skips its native build).
      - name: Clippy for Linux and Windows
        run: |
          for target in x86_64-unknown-linux-gnu x86_64-pc-windows-msvc; do
            CARGO_TARGET_DIR=target/xcheck cargo clippy --lib --tests --target "$target" --features cef/dox -- -D warnings
          done

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings

  # Unsigned: CI builds never see the signing secrets.
  build:
    uses: ./.github/workflows/build.yml
