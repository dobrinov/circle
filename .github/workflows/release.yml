# Pushing a version tag (made with `cargo xtask release X.Y.Z`) publishes a
# GitHub Release with installers for every platform, checksums and the
# matching section of CHANGELOG.md. Tags with a suffix (v0.2.0-beta.1) are
# published as pre-releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing builds with the signing secrets, or publishes, until the
  # maintainer approves the run (the "release" environment requires it).
  approve:
    name: Approve release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - run: echo "Approved ${GITHUB_REF_NAME}"

  check:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag matches Cargo.toml and CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$version" != "$cargo_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $cargo_version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

  build:
    needs: [approve, check]
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      retention-days: 30
      sign: true

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums and release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          (cd artifacts && sha256sum * > SHA256SUMS.txt)
          # The CHANGELOG section for this version, without its heading.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          {
            echo
            echo "### Downloads"
            echo
            echo "| Platform | File |"
            echo "| --- | --- |"
            for f in artifacts/*; do
              name="$(basename "$f")"
              case "$name" in
                *macos-arm64.dmg) p="macOS (Apple Silicon)" ;;
                *macos-x86_64.dmg) p="macOS (Intel)" ;;
                *windows-*-setup.exe) p="Windows installer" ;;
                *windows-*.zip) p="Windows (portable)" ;;
                *_amd64.deb) p="Debian / Ubuntu (x86_64)" ;;
                *_arm64.deb) p="Debian / Ubuntu (arm64)" ;;
                *linux-x86_64.tar.gz) p="Linux (x86_64)" ;;
                *linux-aarch64.tar.gz) p="Linux (arm64)" ;;
                *) continue ;;
              esac
              echo "| $p | [$name](https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$name) |"
            done
            echo
            echo "Verify downloads with \`SHA256SUMS.txt\`."
          } >> notes.md
          cat notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: Circle ${{ github.ref_name }}
          body_path: notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
