# Builds, tests and packages Circle on every supported OS. Called by ci.yml
# (pushes and pull requests), release.yml (version tags) and nightly.yml.
name: Build

on:
  workflow_call:
    inputs:
      retention-days:
        description: How long to keep the packaged artifacts.
        type: number
        default: 14
      require-signing:
        description: Fail on macOS unless the Developer ID secrets are set (releases).
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            test: true
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux (x86_64)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            test: true
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
    env:
      CEF_PATH: ${{ github.workspace }}/../cef
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      # Set when notarization is possible (only checked for being non-empty).
      NOTARIZE: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Cache CEF binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../cef
          key: cef-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Install build tools and Chromium's libraries (Linux)
        if: runner.os == 'Linux'
        # libcef needs these at run time, and the unit tests load it.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build dpkg-dev \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxshmfence1 libpango-1.0-0 libcairo2 libasound2t64 \
            libdbus-1-3 libexpat1 libxss1 libgtk-3-0t64

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Require signing secrets (macOS releases)
        if: runner.os == 'macOS' && inputs.require-signing && (env.MACOS_CERTIFICATE == '' || env.NOTARIZE == '')
        run: |
          echo "::error::Releases must be signed and notarized: add the MACOS_* and APPLE_* secrets (see RELEASING.md)"
          exit 1

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        env:
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          # codesign only finds identities in keychains on the search list.
          security list-keychains -d user -s build.keychain login.keychain
          rm cert.p12

      - name: Unit tests
        if: matrix.test
        shell: bash
        run: |
          cargo build --lib --target ${{ matrix.target }}
          # The test binary links libcef; make the runtime loadable.
          CEF_DIR="$(cat target/${{ matrix.target }}/debug/cef-dir.txt)"
          export LD_LIBRARY_PATH="$CEF_DIR:${LD_LIBRARY_PATH:-}"
          export PATH="$CEF_DIR:$PATH"
          set +e
          cargo test --lib --target ${{ matrix.target }} 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # Surface the cause as annotations, which show on the run page.
            if [ "$RUNNER_OS" = Linux ]; then
              for bin in target/${{ matrix.target }}/debug/deps/circle-*; do
                [ -x "$bin" ] && ldd "$bin" | grep "not found" | sed 's/^/::error title=Missing library::/'
              done
            fi
            grep -E "panicked at|FAILED|error while loading|cannot open shared object" test.log | head -20 | sed 's/^/::error title=Unit tests::/'
          fi
          exit "$status"

      - name: Build and package
        env:
          CIRCLE_CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          # Empty secrets must not override the ad-hoc defaults.
          [ -z "$CIRCLE_CODESIGN_IDENTITY" ] && unset CIRCLE_CODESIGN_IDENTITY
          [ -z "$APPLE_ID" ] && unset APPLE_ID
          cargo xtask dist --target ${{ matrix.target }}

      - name: Check signature and notarization (macOS)
        if: runner.os == 'macOS' && env.MACOS_CERTIFICATE != ''
        run: |
          for dmg in dist/*.dmg; do
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
            codesign --verify --deep --strict --verbose=2 "$mount/Circle.app"
            # Gatekeeper accepts only notarized builds.
            if [ -n "$NOTARIZE" ]; then
              spctl --assess --type execute --verbose=2 "$mount/Circle.app"
            fi
            hdiutil detach "$mount" >/dev/null
            if [ -n "$NOTARIZE" ]; then
              xcrun stapler validate "$dmg"
              spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
            fi
          done

      - uses: actions/upload-artifact@v4
        with:
          name: circle-${{ matrix.target }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
            dist/*-setup.exe
