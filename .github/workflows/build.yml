# Builds, tests and packages Circle on every supported OS. Called by ci.yml
# (pushes and pull requests), release.yml (version tags), nightly.yml and
# signed-check.yml. Only release and signed-check builds sign: everything
# else runs without the signing secrets.
name: Build

on:
  workflow_call:
    inputs:
      retention-days:
        description: How long to keep the packaged artifacts.
        type: number
        default: 14
      sign:
        description: Sign and notarize the macOS app (needs the Developer ID secrets).
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            target: aarch64-apple-darwin
            test: true
          - name: macOS (Intel)
            os: macos-latest
            target: x86_64-apple-darwin
          - name: Linux (x86_64)
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            test: true
          - name: Linux (arm64)
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            test: true
          - name: Windows (x86_64)
            os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
    env:
      CEF_PATH: ${{ github.workspace }}/../cef
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}

      - name: Cache CEF binaries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ github.workspace }}/../cef
          key: cef-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Install build tools and Chromium's libraries (Linux)
        if: runner.os == 'Linux'
        # libcef needs these at run time, and the unit tests load it.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build dpkg-dev \
            libnss3 libnspr4 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 \
            libdrm2 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libxshmfence1 libpango-1.0-0 libcairo2 libasound2t64 \
            libdbus-1-3 libexpat1 libxss1 libgtk-3-0t64

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install Inno Setup (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Require signing secrets (macOS)
        if: runner.os == 'macOS' && inputs.sign
        env:
          HAVE_CERT: ${{ secrets.MACOS_CERTIFICATE != '' }}
          HAVE_NOTARY: ${{ secrets.APPLE_APP_PASSWORD != '' && secrets.APPLE_ID != '' }}
        run: |
          if [ "$HAVE_CERT" != true ] || [ "$HAVE_NOTARY" != true ]; then
            echo "::error::Signed builds need the MACOS_* and APPLE_* secrets (see RELEASING.md)"
            exit 1
          fi

      - name: Import signing certificate (macOS)
        if: runner.os == 'macOS' && inputs.sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          # A throwaway keychain with a random password, deleted after the job.
          password="$(openssl rand -hex 24)"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$password" build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" build.keychain >/dev/null
          # codesign only finds identities in keychains on the search list.
          security list-keychains -d user -s build.keychain login.keychain
          rm "$RUNNER_TEMP/cert.p12"

      - name: Unit tests
        if: matrix.test
        shell: bash
        run: |
          cargo build --lib --target ${{ matrix.target }}
          # The test binary links libcef; make the runtime loadable.
          CEF_DIR="$(cat target/${{ matrix.target }}/debug/cef-dir.txt)"
          export LD_LIBRARY_PATH="$CEF_DIR:${LD_LIBRARY_PATH:-}"
          export PATH="$CEF_DIR:$PATH"
          set +e
          cargo test --lib --target ${{ matrix.target }} 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" != 0 ]; then
            # Surface the cause as annotations, which show on the run page.
            if [ "$RUNNER_OS" = Linux ]; then
              for bin in target/${{ matrix.target }}/debug/deps/circle-*; do
                [ -x "$bin" ] && ldd "$bin" | grep "not found" | sed 's/^/::error title=Missing library::/'
              done
            fi
            grep -E "panicked at|FAILED|error while loading|cannot open shared object" test.log | head -20 | sed 's/^/::error title=Unit tests::/'
          fi
          exit "$status"

      - name: Build and package
        env:
          CIRCLE_CODESIGN_IDENTITY: ${{ inputs.sign && secrets.MACOS_CODESIGN_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.sign && secrets.APPLE_ID || '' }}
          APPLE_APP_PASSWORD: ${{ inputs.sign && secrets.APPLE_APP_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.sign && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          # Unsigned builds are signed ad hoc.
          [ -z "$CIRCLE_CODESIGN_IDENTITY" ] && unset CIRCLE_CODESIGN_IDENTITY
          [ -z "$APPLE_ID" ] && unset APPLE_ID
          cargo xtask dist --target ${{ matrix.target }}

      - name: Check signature and notarization (macOS)
        if: runner.os == 'macOS' && inputs.sign
        run: |
          for dmg in dist/*.dmg; do
            mount="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
            codesign --verify --deep --strict --verbose=2 "$mount/Circle.app"
            codesign --verify -R='anchor apple generic and certificate leaf[subject.OU] = "5ZX3P79WQZ"' "$mount/Circle.app"
            spctl --assess --type execute --verbose=2 "$mount/Circle.app"
            hdiutil detach "$mount" >/dev/null
            xcrun stapler validate "$dmg"
            spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          done

      # The signed app runs under the hardened runtime with only the
      # entitlements in packaging/macos: start it and check a page renders.
      - name: Launch the signed app (macOS)
        if: matrix.target == 'aarch64-apple-darwin' && inputs.sign
        run: |
          dmg="$(ls dist/*.dmg | head -1)"
          mount="$(mktemp -d)"; profile="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg" >/dev/null
          ditto "$mount/Circle.app" "$RUNNER_TEMP/Circle.app"
          hdiutil detach "$mount" >/dev/null
          page="$RUNNER_TEMP/smoke.html"
          echo "<title>ok</title><script>document.title='js-'+(6*7)</script>" > "$page"
          CIRCLE_PROFILE_DIR="$profile" "$RUNNER_TEMP/Circle.app/Contents/MacOS/Circle" \
            --remote-debugging-port=9333 "$page" &
          app=$!
          for _ in $(seq 60); do
            curl -s http://127.0.0.1:9333/json/list | grep -q '"js-42"' && break
            sleep 1
          done
          list="$(curl -s http://127.0.0.1:9333/json/list)"
          kill "$app" 2>/dev/null || true
          if ! echo "$list" | grep -q '"js-42"'; then
            echo "::error::The signed app didn't run JavaScript in a page"
            echo "$list"
            ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i circle || true
            exit 1
          fi
          echo "Pages render and run JavaScript."

      - name: Remove the signing keychain (macOS)
        if: always() && runner.os == 'macOS' && inputs.sign
        run: security delete-keychain build.keychain || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: circle-${{ matrix.target }}
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
          path: |
            dist/*.dmg
            dist/*.tar.gz
            dist/*.deb
            dist/*.zip
            dist/*-setup.exe
