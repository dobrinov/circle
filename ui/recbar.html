<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Circle Recording</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Recording controls floating over the page while the sidebar is
         hidden. Always dark, so they read on any page. Circle sizes the
         overlay to the bar (and rounds its corners). */
      html, body { margin: 0; height: auto; background: hsl(260 18% 13%); color: hsl(0 0% 96%); overflow: hidden; }
      #bar { display: inline-flex; align-items: center; gap: 10px; height: 48px; padding: 0 8px 0 16px; white-space: nowrap; font-size: 13px; }
      #bar:empty { display: none; }
      .dot { width: 9px; height: 9px; flex: none; border-radius: 50%; background: hsl(358 80% 56%); }
      .live .dot { animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.35; } }
      b { font-weight: 650; }
      time { font-variant-numeric: tabular-nums; color: hsl(0 0% 100% / 0.6); font-weight: 500; }
      .sep { width: 1px; height: 22px; background: hsl(0 0% 100% / 0.14); }
      button { height: 30px; padding: 0 12px; border-radius: 6px; background: hsl(0 0% 100% / 0.1); color: inherit; font-weight: 600; }
      button:hover { background: hsl(0 0% 100% / 0.18); }
      .seg { display: flex; padding: 2px; border-radius: 8px; background: hsl(0 0% 100% / 0.08); }
      .seg button { height: 26px; padding: 0 10px; background: none; color: hsl(0 0% 100% / 0.65); font-size: 12px; }
      .seg button.on { background: hsl(0 0% 100% / 0.18); color: white; }
      .chip { height: 26px; padding: 0 10px; font-size: 12px; color: hsl(0 0% 100% / 0.65); background: none; box-shadow: inset 0 0 0 1px hsl(0 0% 100% / 0.16); }
      .chip[aria-pressed="true"] { color: white; background: hsl(268 70% 60% / 0.35); box-shadow: none; }
      .start { background: hsl(358 75% 52%); color: white; display: inline-flex; align-items: center; gap: 7px; }
      .start:hover { background: hsl(358 75% 47%); }
      .start .dot { width: 8px; height: 8px; background: white; }
      .icon { width: 30px; padding: 0; display: grid; place-items: center; background: none; color: hsl(0 0% 100% / 0.6); }
      .icon svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid hsl(0 0% 100% / 0.85); border-right-color: transparent; animation: spin 0.8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #bar.saving { padding-right: 16px; }
    </style>
  </head>
  <body>
    <div id="bar"></div>
    <script src="common.js"></script>
    <script src="recbar.js"></script>
  </body>
</html>
