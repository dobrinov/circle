<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Circle Passwords</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      /* Saved logins under a login field, or "Save password?" after signing
         in. Circle sizes the overlay to #card and rounds its corners. */
      html, body { margin: 0; height: auto; background: var(--panel); color: var(--panel-fg); overflow: hidden; }
      #card { width: 300px; padding: 6px; }
      #card.save { width: 320px; padding: 14px 14px 12px; }
      .head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 8px; color: var(--panel-muted); font-size: 11.5px; }
      .key { width: 14px; height: 14px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; }
      .account { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; border-radius: 8px; text-align: left; font-size: 13px; }
      .account:hover, .account:focus-visible { background: var(--panel-select); outline: none; }
      .avatar { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-weight: 650; font-size: 12px;
        background: hsl(var(--letter-hue, 220) 55% 88%); color: hsl(var(--letter-hue, 220) 45% 28%); }
      .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
      .dots { color: var(--panel-muted); letter-spacing: 1px; font-size: 11px; }
      .foot { border-top: 1px solid hsl(0 0% 50% / 0.18); margin-top: 4px; padding-top: 4px; }
      .link { width: 100%; padding: 7px 8px; border-radius: 8px; text-align: left; font-size: 12.5px; color: var(--panel-muted); }
      .link:hover { background: var(--panel-select); color: var(--panel-fg); }

      .title { display: flex; align-items: flex-start; gap: 10px; }
      .mark { width: 22px; height: 22px; flex: none; border-radius: 50%; margin-top: 1px;
        background: conic-gradient(#4A6CFF, #2A9BA3 33.3%, #45C75B 66.6%, #4A6CFF);
        -webkit-mask: radial-gradient(farthest-side, transparent 52%, #000 56%);
        mask: radial-gradient(farthest-side, transparent 52%, #000 56%); }
      .title b { display: block; font-size: 13.5px; font-weight: 650; }
      .title span { color: var(--panel-muted); font-size: 12px; }
      .close { margin-left: auto; width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; color: var(--panel-muted); flex: none; }
      .close:hover { background: var(--panel-select); color: var(--panel-fg); }
      .close svg { width: 10px; height: 10px; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
      .fields { margin: 12px 0; border-radius: 8px; background: var(--panel-select); padding: 8px 10px; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
      .fields dt { color: var(--panel-muted); }
      .fields dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .actions { display: flex; gap: 8px; justify-content: flex-end; }
      .btn { height: 30px; padding: 0 14px; border-radius: 8px; font-weight: 600; font-size: 12.5px; }
      .btn.quiet { color: var(--panel-muted); }
      .btn.quiet:hover { background: var(--panel-select); color: var(--panel-fg); }
      .btn.primary { background: var(--panel-fg); color: var(--panel); }
      .btn.primary:hover { opacity: 0.88; }
    </style>
  </head>
  <body>
    <div id="card"></div>
    <script src="common.js"></script>
    <script src="autofill.js"></script>
  </body>
</html>
