<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Circle</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      :root {
        --ground: hsl(var(--hue) 45% 95%);
        --ink: hsl(var(--hue) 30% 14%);
        --soft: hsl(var(--hue) 15% 38%);
        --blob-a: hsl(var(--hue) 85% 72% / 0.55);
        --blob-b: hsl(calc(var(--hue) + 70) 90% 70% / 0.45);
        --blob-c: hsl(calc(var(--hue) - 60) 90% 72% / 0.4);
        --card: hsl(0 0% 100% / 0.62);
        --card-line: hsl(var(--hue) 30% 20% / 0.08);
        --key: hsl(0 0% 100% / 0.9);
        --key-line: hsl(var(--hue) 30% 20% / 0.14);
        --grain: 0.07;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: hsl(var(--hue) 30% 9%);
          --ink: hsl(var(--hue) 25% 94%);
          --soft: hsl(var(--hue) 12% 70%);
          --blob-a: hsl(var(--hue) 80% 55% / 0.45);
          --blob-b: hsl(calc(var(--hue) + 70) 85% 55% / 0.32);
          --blob-c: hsl(calc(var(--hue) - 60) 85% 55% / 0.3);
          --card: hsl(var(--hue) 20% 14% / 0.6);
          --card-line: hsl(0 0% 100% / 0.1);
          --key: hsl(var(--hue) 20% 20% / 0.9);
          --key-line: hsl(0 0% 100% / 0.14);
          --grain: 0.1;
        }
      }
      /* The private space: always dark and quieter. */
      body.private {
        --ground: hsl(268 30% 8%);
        --ink: hsl(268 20% 92%);
        --soft: hsl(268 10% 66%);
        --blob-a: hsl(268 70% 45% / 0.35);
        --blob-b: hsl(300 60% 40% / 0.22);
        --blob-c: hsl(230 60% 45% / 0.22);
        --card: hsl(268 20% 13% / 0.6);
        --card-line: hsl(0 0% 100% / 0.1);
        --key: hsl(268 20% 20% / 0.9);
        --key-line: hsl(0 0% 100% / 0.14);
        color-scheme: dark;
      }

      html, body { height: 100%; overflow: hidden; }
      body {
        background: var(--ground);
        color: var(--ink);
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        display: grid;
        place-items: center;
        position: relative;
        transition: background-color 0.3s;
      }

      /* ----- the background: drifting colour fields, a halo, grain ----- */
      .art { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
      .blob { position: absolute; border-radius: 50%; filter: blur(70px); }
      .blob.a { width: 62vmax; height: 62vmax; left: -18vmax; top: -24vmax; background: var(--blob-a); animation: drift-a 26s ease-in-out infinite alternate; }
      .blob.b { width: 54vmax; height: 54vmax; right: -20vmax; top: 6vmax; background: var(--blob-b); animation: drift-b 31s ease-in-out infinite alternate; }
      .blob.c { width: 48vmax; height: 48vmax; left: 18vmax; bottom: -30vmax; background: var(--blob-c); animation: drift-c 23s ease-in-out infinite alternate; }
      @keyframes drift-a { to { transform: translate(8vmax, 6vmax) scale(1.08); } }
      @keyframes drift-b { to { transform: translate(-7vmax, 5vmax) scale(0.94); } }
      @keyframes drift-c { to { transform: translate(-5vmax, -6vmax) scale(1.1); } }
      .halo {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 78vmin;
        height: 78vmin;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: conic-gradient(from 140deg, #2F6BFF, #7B3BFF 22%, #FF3D8B 48%, #FFB23F 66%, #FF3D8B 82%, #7B3BFF 92%, #2F6BFF);
        -webkit-mask: radial-gradient(farthest-side, transparent 64%, #000 66%, #000 100%);
        mask: radial-gradient(farthest-side, transparent 64%, #000 66%, #000 100%);
        filter: blur(44px);
        opacity: 0.32;
        animation: turn 60s linear infinite;
      }
      body.private .halo { opacity: 0.16; }
      @keyframes turn { to { transform: translate(-50%, -50%) rotate(360deg); } }
      .grain {
        position: absolute;
        inset: 0;
        opacity: var(--grain);
        mix-blend-mode: overlay;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      @media (prefers-reduced-motion: reduce) {
        .blob, .halo { animation: none; }
      }

      /* ----- the centre ----- */
      main { position: relative; text-align: center; padding: 24px; max-width: 640px; }
      .logo { width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 50%;
        background: conic-gradient(from 140deg, #2F6BFF, #7B3BFF 22%, #FF3D8B 48%, #FFB23F 66%, #FF3D8B 82%, #7B3BFF 92%, #2F6BFF);
        -webkit-mask: radial-gradient(farthest-side, transparent 58%, #000 60%);
        mask: radial-gradient(farthest-side, transparent 58%, #000 60%);
        filter: drop-shadow(0 8px 24px hsl(268 80% 50% / 0.35));
      }
      h1 { margin: 0; font-size: clamp(28px, 4.4vw, 44px); line-height: 1.1; letter-spacing: -0.03em; font-weight: 700; }
      .lead { margin: 10px 0 30px; color: var(--soft); font-size: 16px; }

      .spotlight {
        display: inline-flex;
        align-items: center;
        gap: 14px;
        min-height: 60px;
        padding: 0 14px 0 22px;
        border-radius: 16px;
        border: 1px solid var(--card-line);
        background: var(--card);
        backdrop-filter: blur(20px) saturate(1.3);
        box-shadow: 0 1px 2px hsl(0 0% 0% / 0.05), 0 18px 50px hsl(var(--hue) 50% 20% / 0.14);
        color: var(--soft);
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.15s, box-shadow 0.15s;
      }
      .spotlight:hover { transform: translateY(-1px); box-shadow: 0 1px 2px hsl(0 0% 0% / 0.05), 0 24px 60px hsl(var(--hue) 50% 20% / 0.2); color: var(--ink); }
      .spotlight:focus-visible { outline: 2px solid hsl(var(--hue) 70% 55%); outline-offset: 3px; }
      .spotlight svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
      .spotlight .text { min-width: 220px; text-align: left; }
      .keys { display: inline-flex; gap: 5px; }
      kbd {
        min-width: 30px;
        height: 30px;
        padding: 0 8px;
        border-radius: 8px;
        border: 1px solid var(--key-line);
        border-bottom-width: 2px;
        background: var(--key);
        color: var(--ink);
        display: inline-grid;
        place-items: center;
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      }
      .hints { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 26px; margin-top: 30px; color: var(--soft); font-size: 13px; }
      .hints span { display: inline-flex; align-items: center; gap: 8px; }
      .hints kbd { min-width: 24px; height: 24px; padding: 0 6px; border-radius: 6px; font-size: 12px; }
      .monkey { display: none; font-size: 72px; line-height: 1; margin: 0 auto 18px; filter: drop-shadow(0 10px 30px hsl(268 80% 40% / 0.5)); }
      body.private .monkey { display: block; }
      /* Just the colour fields in normal mode: no logo, no ring. */
      .logo, .halo { display: none; }
      body.private .halo { display: block; }
      .private-note { display: none; margin-top: 26px; color: var(--soft); font-size: 13px; }
      body.private .private-note { display: block; }
    </style>
  </head>
  <body>
    <div class="art" aria-hidden="true">
      <div class="blob a"></div>
      <div class="blob b"></div>
      <div class="blob c"></div>
      <div class="halo"></div>
      <div class="grain"></div>
    </div>

    <main>
      <div class="logo" aria-hidden="true"></div>
      <div class="monkey" aria-hidden="true">🙈</div>
      <h1 id="greeting">Hello</h1>
      <p class="lead" id="lead">Where to next?</p>
      <button class="spotlight" id="spotlight">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
        <span class="text">Search, open a site or jump to a tab</span>
        <span class="keys" id="keys"><kbd>⌘</kbd><kbd>K</kbd></span>
      </button>
      <div class="hints" id="hints"></div>
      <p class="private-note">Nothing here is saved: no history, cookies or cache.</p>
    </main>

    <script src="common.js"></script>
    <script>
      (() => {
        const $ = (id) => document.getElementById(id);
        let mac = navigator.platform.startsWith("Mac");

        const GREETINGS = {
          night: ["Still up?", "Hello, night owl", "Burning the midnight oil", "The quiet hours"],
          morning: ["Good morning", "Rise and shine", "Morning, sunshine", "Hello, early bird", "A fresh start"],
          afternoon: ["Good afternoon", "Hey there", "Afternoon!", "Hello again", "Keep it rolling"],
          evening: ["Good evening", "Evening!", "Winding down?", "Hello, evening", "Golden hour"],
        };
        const MOTIVATION = [
          "Small steps, every day.",
          "Stay curious.",
          "One tab at a time.",
          "Done is better than perfect.",
          "Focus on what matters.",
          "Less noise, more signal.",
          "Make it simple, then make it great.",
          "Go make something you're proud of.",
          "Today is a good day to learn something.",
          "You've got this.",
          "Curiosity is a superpower.",
          "Start where you are.",
          "Progress, not perfection.",
          "Ship it.",
          "Deep work beats busy work.",
          "Ask better questions.",
        ];
        const pick = (list) => list[Math.floor(Math.random() * list.length)];
        let picked = null;

        // A new greeting and line each time the splash appears, not on
        // every state update.
        function choose() {
          const h = new Date().getHours();
          const part = h < 5 ? "night" : h < 12 ? "morning" : h < 18 ? "afternoon" : h < 23 ? "evening" : "night";
          picked = { greeting: pick(GREETINGS[part]), lead: pick(MOTIVATION) };
        }

        function greet(isPrivate) {
          if (!picked) choose();
          $("greeting").textContent = isPrivate ? "Fap mode" : picked.greeting;
          $("lead").textContent = isPrivate ? "Nobody's watching. Nothing is saved." : picked.lead;
        }
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") {
            choose();
            greet(document.body.classList.contains("private"));
          }
        });

        let isPrivate = false;

        function keys() {
          const mod = mac ? "⌘" : "Ctrl";
          $("keys").innerHTML = `<kbd>${mod}</kbd><kbd>K</kbd>`;
          const hint = (combo, label) => `<span>${combo.map((k) => `<kbd>${k}</kbd>`).join("")} ${label}</span>`;
          $("hints").innerHTML = [
            hint([mod, "T"], "New tab"),
            hint([mod, "S"], "Show or hide the sidebar"),
            isPrivate
              ? hint(mac ? ["⇧", mod, "."] : [mod, "Shift", "."], "End fap mode instantly")
              : hint(mac ? ["⇧", mod, "N"] : [mod, "Shift", "N"], "Fap mode"),
          ].join("");
        }

        circle.render = (state) => {
          mac = state.platform === "macos";
          const space = state.spaces[state.active_space];
          circle.setHue(space.private ? 268 : space.hue);
          isPrivate = !!space.private;
          document.body.classList.toggle("private", isPrivate);
          greet(!!space.private);
          keys();
        };

        $("spotlight").addEventListener("click", () => circle.action({ open_palette: "spotlight" }));
        greet(false);
        keys();
        circle.send({ cmd: "ready", from: "start" });
      })();
    </script>
  </body>
</html>
