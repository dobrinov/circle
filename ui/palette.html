<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Circle Command Bar</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      :root {
        --glass: hsl(0 0% 100% / 0.9);
        --scrim: hsl(var(--hue) 30% 12% / 0.22);
        --hairline: hsl(var(--hue) 30% 12% / 0.08);
        --key: hsl(var(--hue) 30% 12% / 0.07);
        --pick: hsl(var(--hue) 75% 50% / 0.09);
        --pick-ring: hsl(var(--hue) 75% 50% / 0.22);
        --tile: hsl(var(--hue) 30% 12% / 0.04);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --glass: hsl(var(--hue) 14% 15% / 0.92);
          --scrim: hsl(0 0% 0% / 0.35);
          --hairline: hsl(0 0% 100% / 0.08);
          --key: hsl(0 0% 100% / 0.1);
          --pick: hsl(var(--hue) 80% 72% / 0.13);
          --pick-ring: hsl(var(--hue) 80% 72% / 0.26);
          --tile: hsl(0 0% 100% / 0.04);
        }
      }

      html, body { background: transparent; color: var(--panel-fg); height: 100%; }

      /* ----- the blurred backdrop (Spotlight, new tab, edit address) ----- */
      #backdrop { position: fixed; inset: 0; display: none; overflow: hidden; background: var(--frame, transparent); }
      body.backdrop #backdrop { display: block; }
      #backdrop img {
        position: absolute;
        border-radius: 8px;
        filter: blur(14px) saturate(1.1);
        transform: scale(1.02);
        opacity: 0;
        transition: opacity 0.12s;
      }
      #backdrop img.ready { opacity: 1; }
      #backdrop::after { content: ""; position: absolute; inset: 0; background: var(--scrim); }
      /* Over the splash (no page open): its colour fields, blurred. */
      #backdrop.splash {
        background:
          radial-gradient(60% 70% at 15% 10%, hsl(var(--hue) 85% 72% / 0.5), transparent 70%),
          radial-gradient(50% 60% at 90% 35%, hsl(calc(var(--hue) + 70) 90% 70% / 0.4), transparent 70%),
          radial-gradient(50% 60% at 45% 105%, hsl(calc(var(--hue) - 60) 90% 72% / 0.35), transparent 70%),
          hsl(var(--hue) 45% 95%);
        filter: blur(18px);
        inset: -30px;
      }
      @media (prefers-color-scheme: dark) {
        #backdrop.splash {
          background:
            radial-gradient(60% 70% at 15% 10%, hsl(var(--hue) 80% 55% / 0.4), transparent 70%),
            radial-gradient(50% 60% at 90% 35%, hsl(calc(var(--hue) + 70) 85% 55% / 0.3), transparent 70%),
            radial-gradient(50% 60% at 45% 105%, hsl(calc(var(--hue) - 60) 85% 55% / 0.28), transparent 70%),
            hsl(var(--hue) 30% 9%);
        }
      }

      #panel {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      body.backdrop #panel {
        position: absolute;
        left: 50%;
        top: var(--panel-top, 104px);
        width: min(680px, calc(100% - 48px));
        transform: translateX(-50%);
        max-height: calc(100% - var(--panel-top, 104px) - 24px);
        display: flex;
        flex-direction: column;
        border: 0;
        border-radius: 18px;
        background: var(--glass);
        box-shadow: 0 0 0 1px var(--hairline), 0 30px 80px hsl(var(--hue) 40% 10% / 0.28), 0 8px 24px hsl(var(--hue) 40% 10% / 0.12);
        animation: rise 0.14s ease-out;
      }
      @keyframes rise { from { opacity: 0; transform: translate(-50%, 6px) scale(0.985); } }

      #bar { display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 10px 0 12px; flex: none; }
      body.backdrop #bar { height: 68px; gap: 14px; padding: 0 18px 0 22px; border-bottom: 1px solid var(--hairline); }
      #bar > svg { width: 18px; height: 18px; stroke: var(--panel-muted); fill: none; stroke-width: 2; stroke-linecap: round; flex: none; }
      body.backdrop #bar > svg { width: 22px; height: 22px; stroke: var(--accent); stroke-width: 2.2; }
      #q { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; font-size: 14px; }
      body.backdrop #q { font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
      #q::placeholder { color: var(--panel-muted); font-weight: 400; }
      #count { color: var(--panel-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .nav-btn { width: 26px; height: 26px; border-radius: 6px; display: none; place-items: center; color: var(--panel-muted); }
      body.find .nav-btn { display: grid; }
      .nav-btn:hover { background: var(--panel-select); color: var(--panel-fg); }
      .key {
        height: 22px;
        min-width: 22px;
        padding: 0 6px;
        border-radius: 6px;
        background: var(--key);
        color: var(--panel-muted);
        font-size: 12px;
        font-weight: 700;
        display: inline-grid;
        place-items: center;
        flex: none;
      }
      #esc { display: none; }
      body.backdrop #esc { display: inline-grid; }

      #results { padding: 8px 10px 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
      #results:empty, body.find #results { display: none; }
      .group { padding: 10px 12px 5px; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--panel-muted); }
      .group:first-child { padding-top: 6px; }

      .item { display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 14px; border-radius: 10px; cursor: default; }
      .item.selected { background: var(--pick); box-shadow: inset 0 0 0 1px var(--pick-ring); }
      .item .icon { width: 22px; height: 22px; border-radius: 6px; }
      .item .letter { font-size: 11px; }
      .item .title { flex: 1; min-width: 0; font-size: 14px; }
      .item .title b { font-weight: 650; }
      .item .meta { flex: none; max-width: 42%; font-size: 12px; color: var(--panel-muted); display: inline-flex; align-items: center; gap: 6px; }
      .item .hint { display: none; flex: none; font-size: 12px; font-weight: 600; color: var(--accent); }
      .item.selected .hint { display: inline; }
      .item .enter { display: none; background: var(--accent); color: var(--panel); }
      .item.selected .enter { display: inline-grid; }
      .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: hsl(var(--dot-hue) 50% 64%); }
      .glyph { width: 22px; height: 22px; display: grid; place-items: center; color: var(--panel-muted); flex: none; }
      .glyph svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

      /* The best match: a bigger row. */
      .item.top { height: auto; padding: 12px 14px; border-radius: 12px; gap: 14px; }
      .item.top .icon { width: 40px; height: 40px; border-radius: 10px; }
      .item.top .letter { font-size: 18px; }
      .item.top .title { display: flex; flex-direction: column; gap: 2px; }
      .item.top .title > span:first-child { font-size: 15px; font-weight: 600; }
      .item.top .title .meta { max-width: none; font-size: 13px; }

      /* Just opened: spaces as chips, recent tabs as tiles. */
      .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 4px 6px; }
      .item.chip { height: 34px; padding: 0 14px; border-radius: 999px; gap: 8px; background: var(--tile); font-size: 13px; font-weight: 600; }
      .item.chip .dot { width: 10px; height: 10px; }
      .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 2px 4px 6px; }
      .item.tile { height: auto; padding: 12px; border-radius: 12px; background: var(--tile); }
      .item.tile.selected { background: var(--pick); }
      .item.tile .icon { width: 34px; height: 34px; border-radius: 9px; }
      .item.tile .letter { font-size: 15px; }
      .item.tile .title { display: flex; flex-direction: column; }
      .item.tile .title > span:first-child { font-size: 14px; font-weight: 600; }
      .item.tile .title .meta { max-width: none; }

      #keys { display: none; align-items: center; gap: 18px; height: 42px; padding: 0 22px; flex: none; border-top: 1px solid var(--hairline); background: var(--tile); font-size: 12px; color: var(--panel-muted); }
      body.backdrop #keys { display: flex; }
      #keys span { display: inline-flex; align-items: center; gap: 6px; }
    </style>
  </head>
  <body>
    <div id="backdrop"></div>
    <div id="panel" role="dialog" aria-label="Command bar">
      <div id="bar">
        <svg id="glyph" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="m16 16 4.5 4.5" /></svg>
        <input id="q" spellcheck="false" autocomplete="off" aria-label="Search" />
        <span id="count"></span>
        <span class="key" id="esc">esc</span>
        <button class="nav-btn" id="prev" title="Previous (⇧↩)">↑</button>
        <button class="nav-btn" id="next" title="Next (↩)">↓</button>
        <button class="nav-btn" id="close" title="Close (Esc)">✕</button>
      </div>
      <div id="results"></div>
      <div id="keys"></div>
    </div>
    <script src="common.js"></script>
    <script src="palette.js"></script>
  </body>
</html>
