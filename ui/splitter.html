<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Circle Splitter</title>
    <style>
      /* The drag handle in the gap between the pages and docked DevTools.
         Its background is the window's, so only the handle line shows. */
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
      body::after { content: ""; position: absolute; inset: 0; margin: auto; border-radius: 2px;
        background: hsl(0 0% 50% / 0.55); opacity: 0; transition: opacity 0.12s; }
      body.col::after { width: 3px; height: 36px; }
      body.row::after { width: 36px; height: 3px; }
      body:hover::after, body.dragging::after { opacity: 1; }
    </style>
  </head>
  <body>
    <script src="common.js"></script>
    <script src="splitter.js"></script>
  </body>
</html>
