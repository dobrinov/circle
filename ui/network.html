<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Network</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      :root {
        --bg: #141821; --bg2: #0e1118; --raise: #1c2130; --line: rgba(255,255,255,.07); --line2: rgba(255,255,255,.045);
        --fg: #e6e8ee; --fg2: #c9ceda; --muted: #9aa1b2; --dim: #7c8496; --accent: #7b93ff; --on-accent: #0e1118;
        --sel: rgba(123,147,255,.13); --hover: rgba(255,255,255,.035); --chip: rgba(255,255,255,.07);
        --gql: #f7a6da; --gql-bg: rgba(242,123,200,.14); --rest: #7ed6da; --rest-bg: rgba(79,195,201,.14);
        --live: #f5c987; --live-bg: rgba(242,179,91,.16); --post: #b5c3ff; --post-bg: rgba(123,147,255,.16);
        --err: #ffb3b3; --err-strong: #ff8a8a; --err-bg: rgba(255,107,107,.15); --ok: #7ee0a2; --ok-bg: rgba(126,224,162,.12);
        --chg-bg: rgba(242,179,91,.13); --str: #9be3b0; --num: #f5c987; --key: #b5c3ff; --punc: #7c8496;
        --bar-gql: #f27bc8; --bar-rest: #4fc3c9; --bar-live: #f2b35b; --bar-asset: #6b7386; --bar-err: #ff7a7a;
        --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        color-scheme: dark;
      }
      :root[data-theme="light"] {
        --bg: #ffffff; --bg2: #f4f5f8; --raise: #ffffff; --line: rgba(20,24,40,.10); --line2: rgba(20,24,40,.06);
        --fg: #1b1f2a; --fg2: #3a4152; --muted: #5f6677; --dim: #687083; --accent: #4a6cff; --on-accent: #fff;
        --sel: rgba(74,108,255,.10); --hover: rgba(20,24,40,.035); --chip: rgba(20,24,40,.06);
        --gql: #a8237a; --gql-bg: rgba(229,53,171,.10); --rest: #0f6e74; --rest-bg: rgba(42,155,163,.12);
        --live: #855600; --live-bg: rgba(242,179,91,.22); --post: #3450d6; --post-bg: rgba(74,108,255,.11);
        --err: #b42323; --err-strong: #b42323; --err-bg: rgba(220,50,50,.10); --ok: #1e7b3c; --ok-bg: rgba(30,123,60,.10);
        --chg-bg: rgba(242,179,91,.22); --str: #1e7b3c; --num: #855600; --key: #3450d6; --punc: #687083;
        --bar-asset: #b4bac8;
        color-scheme: light;
      }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
      * { box-sizing: border-box; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; }
      input, textarea, select { font: inherit; color: var(--fg); }
      a { color: var(--accent); }
      .mono { font-family: var(--mono); }
      #app { position: absolute; inset: 0; display: flex; flex-direction: column; min-width: 0; }
      #grip { position: absolute; z-index: 5; }
      body.right #grip { left: 0; top: 0; bottom: 0; width: 6px; cursor: col-resize; }
      body.bottom #grip { left: 0; right: 0; top: 0; height: 6px; cursor: row-resize; }

      header { display: flex; align-items: center; gap: 8px; padding: 10px 12px 10px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
      header h1 { margin: 0; font-size: 14px; font-weight: 650; }
      header .tab { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .rec { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
      .rec i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
      .rec.on { color: var(--err-strong); } .rec.on i { background: #ff6b6b; }
      .tools { margin-left: auto; display: flex; gap: 4px; flex: none; }
      .btn { height: 28px; padding: 0 10px; border-radius: 6px; background: var(--chip); color: var(--fg2); font-size: 12px; white-space: nowrap; }
      .btn:hover { color: var(--fg); filter: brightness(1.15); }
      .btn.on { background: var(--sel); color: var(--fg); box-shadow: inset 0 0 0 1px var(--accent); }
      .btn.primary { background: var(--accent); color: var(--on-accent); font-weight: 650; }
      .btn.icon { width: 28px; padding: 0; display: inline-grid; place-items: center; }
      .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

      .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
      .search { flex: 1 1 200px; min-width: 140px; display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: 7px; background: var(--bg2); border: 1px solid var(--line); }
      .search svg { width: 13px; height: 13px; stroke: var(--muted); fill: none; stroke-width: 2; flex: none; }
      .search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: 12.5px; }
      .kinds { display: flex; gap: 3px; flex-wrap: wrap; }
      .kind { height: 28px; padding: 0 9px; border-radius: 6px; font-size: 12px; white-space: nowrap; background: var(--chip); color: var(--muted); }
      .kind.all.on { background: var(--fg); color: var(--bg); font-weight: 600; }
      .kind.graphql { background: var(--gql-bg); color: var(--gql); } .kind.rest { background: var(--rest-bg); color: var(--rest); }
      .kind.live { background: var(--live-bg); color: var(--live); }
      .kind.graphql.on, .kind.rest.on, .kind.live.on, .kind.asset.on { box-shadow: inset 0 0 0 1.5px currentColor; font-weight: 650; }
      .kind.asset.on { color: var(--fg); }

      #main { flex: 1; min-height: 0; display: flex; position: relative; }
      .pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
      .scroll { overflow: auto; min-height: 0; flex: 1; }
      footer { display: flex; flex-wrap: wrap; gap: 14px; padding: 7px 14px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--muted); }
      footer .bad { color: var(--err); }
      footer .hint { margin-left: auto; }
      @media (max-width: 760px) { footer .hint { display: none; } }

      /* The request list */
      .row { display: grid; grid-template-columns: 78px minmax(0,1fr) 46px 58px 60px 110px; align-items: center; gap: 10px; padding: 0 12px; height: 34px; border-bottom: 1px solid var(--line2); font-size: 12.5px; }
      .narrow .row { grid-template-columns: 74px minmax(0,1fr) 44px 56px; }
      .narrow .row .size, .narrow .row .tl { display: none; }
      .row.head { height: 26px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); position: sticky; top: 0; background: var(--bg); z-index: 1; }
      .row.item:hover { background: var(--hover); }
      .row.item.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
      .row.child { padding-left: 34px; color: var(--fg2); }
      .num { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
      .num.bad { color: var(--err-strong); font-weight: 600; }
      .num.ok { color: var(--ok); }
      .what { display: flex; gap: 8px; align-items: baseline; min-width: 0; white-space: nowrap; overflow: hidden; }
      .what b { font-weight: 600; }
      .what .sub { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; }
      .what .path { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
      .p { color: var(--rest); } .q { color: var(--muted); }
      .badge { justify-self: start; display: inline-flex; align-items: center; height: 19px; padding: 0 6px; border-radius: 5px; font-size: 10.5px; font-weight: 650; letter-spacing: .02em; white-space: nowrap; }
      .b-gql { background: var(--gql-bg); color: var(--gql); } .b-rest { background: var(--rest-bg); color: var(--rest); }
      .b-post { background: var(--post-bg); color: var(--post); } .b-live { background: var(--live-bg); color: var(--live); }
      .b-err { background: var(--err-bg); color: var(--err); } .b-plain { background: var(--chip); color: var(--fg2); }
      .pill { font-size: 10.5px; font-weight: 600; border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
      .pill.err { background: var(--err-bg); color: var(--err); } .pill.rep { background: var(--chip); color: var(--fg2); }
      .pill.chg { background: var(--chg-bg); color: var(--live); }
      .tl { height: 6px; border-radius: 3px; background: var(--chip); position: relative; overflow: hidden; }
      .tl span { position: absolute; top: 0; height: 6px; border-radius: 3px; min-width: 3px; }
      .more { width: 100%; text-align: left; padding: 10px 14px; color: var(--muted); font-size: 12px; }
      .more:hover { color: var(--fg); }
      .group-head { padding: 9px 14px 3px; font-size: 11.5px; color: var(--muted); }

      /* Compact side list next to a detail */
      .side { flex: 0 0 300px; border-right: 1px solid var(--line); }
      .li { display: flex; flex-direction: column; gap: 2px; padding: 8px 12px; border-bottom: 1px solid var(--line2); }
      .li:hover { background: var(--hover); }
      .li.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
      .li .l1 { display: flex; gap: 7px; align-items: center; min-width: 0; }
      .li .l1 b, .li .l1 .path { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
      .li .l1 .end { margin-left: auto; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
      .li .l2 { font-size: 11.5px; color: var(--muted); padding-left: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* Detail */
      .detail { flex: 1; min-width: 0; }
      .dhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 16px 8px; }
      .dhead h2 { margin: 0; font-size: 17px; font-weight: 650; overflow-wrap: anywhere; min-width: 0; }
      .dhead h2.mono { font-size: 14px; font-weight: 600; }
      .dhead .where { font-family: var(--mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
      .dhead .acts { margin-left: auto; display: flex; gap: 5px; flex-wrap: wrap; position: relative; }
      .back { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12.5px; }
      .back:hover { color: var(--fg); }
      .back svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
      .strip { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 10px; }
      .chip { font-size: 11.5px; background: var(--chip); color: var(--fg2); border-radius: 6px; padding: 3px 8px; white-space: nowrap; }
      .chip.err { background: var(--err-bg); color: var(--err); font-weight: 600; }
      .chip.ok { background: var(--ok-bg); color: var(--ok); font-weight: 600; }
      button.chip:hover { color: var(--fg); }
      button.chip.on { box-shadow: inset 0 0 0 1px var(--accent); background: var(--sel); color: var(--fg); font-weight: 600; }
      .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); }
      .tabs button { padding: 8px 10px; font-size: 12.5px; color: var(--muted); border-bottom: 2px solid transparent; }
      .tabs button.on { color: var(--fg); font-weight: 600; border-bottom-color: var(--accent); }
      .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); }
      .cols > div { background: var(--bg); min-width: 0; padding: 4px 0 16px; }
      .sect { padding: 10px 16px 4px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 10.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
      .sect .aside { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 11.5px; }
      .block { padding: 2px 16px 10px; overflow: auto; }
      pre.code { margin: 0; font: 12px/20px var(--mono); white-space: pre; tab-size: 2; }
      .kw { color: var(--gql); } .op { color: var(--fg); font-weight: 650; } .var { color: var(--num); } .ty { color: var(--rest); }
      .fld { color: var(--fg2); } .str { color: var(--str); } .pun { color: var(--punc); } .com { color: var(--dim); font-style: italic; }
      .errf { color: var(--err); text-decoration: underline wavy var(--err-strong); text-underline-offset: 4px; }
      .kv { display: grid; grid-template-columns: minmax(90px, max-content) minmax(0, 1fr); gap: 3px 14px; font: 12px/1.6 var(--mono); }
      .kv .k { color: var(--key); white-space: nowrap; }
      .kv .v { overflow-wrap: anywhere; color: var(--fg); }
      .kv .v.dim { color: var(--muted); }
      .note { font-size: 11.5px; color: var(--muted); padding: 0 16px 8px; }
      .empty { margin: auto; text-align: center; color: var(--muted); max-width: 340px; padding: 24px; line-height: 1.5; }
      .empty b { display: block; color: var(--fg); font-size: 14px; margin-bottom: 6px; }
      .empty .btn { margin-top: 12px; }

      .errcard { margin: 6px 16px 10px; border: 1px solid color-mix(in srgb, var(--err-strong) 40%, transparent); background: var(--err-bg); border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
      .errcard .t { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
      .errcard .t b { font-size: 13px; overflow-wrap: anywhere; }
      .errcard .code { margin-left: auto; font: 10.5px var(--mono); color: var(--err); background: var(--err-bg); border-radius: 4px; padding: 2px 6px; }
      .errcard .path { font: 11.5px var(--mono); color: var(--fg2); }
      .warn { margin: 6px 16px 10px; border: 1px solid color-mix(in srgb, var(--live) 40%, transparent); background: var(--live-bg); border-radius: 9px; padding: 10px 12px; font-size: 12.5px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .warn span { flex: 1 1 200px; }

      /* JSON tree */
      .tree { font: 12px/20px var(--mono); }
      .tree details > summary { list-style: none; cursor: default; white-space: nowrap; }
      .tree details > summary::-webkit-details-marker { display: none; }
      .tree details > summary::before { content: "▸"; display: inline-block; width: 12px; color: var(--punc); }
      .tree details[open] > summary::before { content: "▾"; }
      .tree .kids { padding-left: 16px; border-left: 1px solid var(--line2); margin-left: 4px; }
      .tree .leaf { white-space: nowrap; padding-left: 12px; }
      .tree .k { color: var(--key); }
      .tree .s { color: var(--str); } .tree .n { color: var(--num); } .tree .b { color: var(--gql); } .tree .z { color: var(--err); }
      .tree .meta { color: var(--dim); font-size: 11px; margin-left: 6px; }
      .tree .v { cursor: copy; border-radius: 3px; }
      .tree .v:hover { background: var(--chip); }
      .tree .chg { background: var(--chg-bg); border-radius: 4px; }
      .tree .add { background: var(--ok-bg); border-radius: 4px; }
      .tree .del { background: var(--err-bg); border-radius: 4px; text-decoration: line-through; opacity: .8; }
      .tree .old { color: var(--dim); text-decoration: line-through; margin-right: 6px; }
      .tree .tag { color: var(--live); font-size: 10.5px; margin-left: 8px; }
      .tree .trunc { white-space: normal; overflow-wrap: anywhere; }

      .rt { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0,1fr) 56px; gap: 6px 10px; align-items: center; padding: 4px 16px 10px; font-size: 11.5px; }
      .rt .n { font-family: var(--mono); color: var(--fg2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .rt .bar { height: 8px; padding: 0; border: 0; border-radius: 4px; background: var(--chip); position: relative; display: block; }
      .rt .bar span { position: absolute; top: 0; height: 8px; border-radius: 4px; background: var(--bar-gql); min-width: 2px; }
      .rt .d { text-align: right; color: var(--muted); }
      .seg { display: inline-flex; gap: 2px; background: var(--chip); border-radius: 6px; padding: 2px; }
      .seg button { height: 22px; padding: 0 8px; border-radius: 5px; font-size: 11.5px; color: var(--muted); }
      .seg button.on { background: var(--raise); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
      .filterbox { margin: 2px 16px 8px; display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; border-radius: 7px; background: var(--bg2); border: 1px solid var(--line); }
      .filterbox input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font: 11.5px var(--mono); }
      .menu { position: absolute; right: 0; top: 32px; z-index: 10; background: var(--raise); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 12px 30px rgba(0,0,0,.35); padding: 4px; display: flex; flex-direction: column; min-width: 180px; }
      .menu button { text-align: left; padding: 7px 10px; border-radius: 6px; font-size: 12.5px; }
      .menu button:hover { background: var(--sel); }
      .toast { position: absolute; left: 50%; bottom: 46px; transform: translateX(-50%); background: var(--fg); color: var(--bg); border-radius: 8px; padding: 6px 12px; font-size: 12px; z-index: 20; pointer-events: none; }
      .jwt { margin: 4px 0 8px; padding: 8px 10px; border-radius: 8px; background: var(--bg2); }

      /* Timing */
      .timing { display: grid; grid-template-columns: 110px minmax(0,1fr) 64px; gap: 8px 10px; align-items: center; padding: 8px 16px; font-size: 12px; }
      .timing .bar { height: 10px; padding: 0; border: 0; border-radius: 3px; background: var(--chip); position: relative; display: block; }
      .timing .bar span { position: absolute; top: 0; height: 10px; border-radius: 3px; min-width: 2px; }

      /* WebSockets */
      .conns { flex: 0 0 250px; border-right: 1px solid var(--line); }
      .conn { display: flex; flex-direction: column; gap: 3px; padding: 9px 12px; border-bottom: 1px solid var(--line2); }
      .conn:hover { background: var(--hover); }
      .conn.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
      .conn .l1 { display: flex; align-items: center; gap: 7px; }
      .conn .l1 b { font-weight: 600; }
      .conn .l1 .end { margin-left: auto; font-size: 11.5px; color: var(--muted); }
      .conn .u { font: 11px var(--mono); color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .conn .c { font-size: 11.5px; color: var(--fg2); display: flex; gap: 10px; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
      .dot.off { background: var(--dim); } .dot.bad { background: var(--err-strong); }
      .msgs { flex: 1 1 380px; border-right: 1px solid var(--line); }
      .msg { display: grid; grid-template-columns: 16px 62px minmax(60px, max-content) minmax(0,1fr) 48px; gap: 9px; align-items: center; height: 30px; padding: 0 12px; border-bottom: 1px solid var(--line2); font-size: 12px; width: 100%; text-align: left; }
      .msg:hover { background: var(--hover); }
      .msg.sel { background: var(--sel); box-shadow: inset 3px 0 0 var(--accent); }
      .msg.hb { color: var(--muted); background: var(--hover); }
      .msg .t { font: 11px var(--mono); color: var(--muted); white-space: nowrap; }
      .msg .pv { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .msg .pv .mono { font-size: 11.5px; color: var(--muted); }
      .up { color: var(--post); } .down { color: var(--ok); }
      .msgdetail { flex: 1 1 340px; }
      .connchips { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid var(--line); overflow-x: auto; }
      .stack { flex-direction: column; }
      .stack .conns, .stack .msgs { flex: none; border-right: 0; border-bottom: 1px solid var(--line); }
      .stack .msgs { height: 50%; }

      /* Edit & replay */
      .editor { position: relative; margin: 2px 16px 8px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line); }
      .editor pre, .editor textarea { margin: 0; padding: 10px 12px; font: 12px/20px var(--mono); white-space: pre; tab-size: 2; overflow: auto; }
      .editor pre { position: absolute; inset: 0; pointer-events: none; }
      .editor textarea { position: relative; display: block; width: 100%; min-height: 120px; resize: vertical; border: 0; outline: none; background: transparent; color: transparent; caret-color: var(--fg); }
      .editor textarea.plain { color: var(--fg); }
      .editor:focus-within { border-color: var(--accent); }
      .bad-input { color: var(--err); font-size: 11.5px; padding: 0 16px 6px; }
      .urlrow { display: flex; gap: 6px; padding: 2px 16px 8px; }
      .urlrow select, .urlrow input { height: 30px; border-radius: 7px; background: var(--bg2); border: 1px solid var(--line); padding: 0 8px; font: 12px var(--mono); }
      .urlrow input { flex: 1; min-width: 0; }
      .sbs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; padding: 4px 16px 12px; }
      .sbs > div { background: var(--bg2); border-radius: 9px; padding: 10px 12px; min-width: 0; overflow: auto; }
      .sbs .cap { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
      .hist { display: grid; grid-template-columns: 34px minmax(0,1fr) auto 60px; gap: 10px; align-items: center; padding: 6px 10px; border-radius: 6px; font-size: 12px; width: 100%; text-align: left; }
      .hist:hover { background: var(--hover); }
      .hist.on { background: var(--sel); }
      .spin { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .block, .tree, .kv, pre, .errcard, .dhead h2, .where { user-select: text; }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    </style>
  </head>
